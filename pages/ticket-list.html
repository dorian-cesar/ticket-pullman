<h1 class="mb-4 fw-bold">Listado de Tickets</h1>
<div id="actions-panel" class="actions-panel text-end"></div>
<div class="inner-container">
  <table
    id="ticketsTable"
    class="table table-striped table-bordered"
    style="width: 100%"
  >
    <thead>
      <tr>
        <th class="hidden">ID</th>
        <th>Empresa</th>
        <th>Área Ejecutora</th>
        <th>Tipo de Atención</th>
        <th>Producto</th>
        <th>Descripción</th>
        <th>Estado</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <!-- Los datos de los tickets serán insertados aquí dinámicamente -->
    </tbody>
  </table>
</div>

<div
  class="modal fade"
  id="statusModal"
  tabindex="-1"
  aria-labelledby="statusModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-warning text-white">
        <h5 class="modal-title" id="statusModalLabel">Cambiar Estado</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Cerrar"
        ></button>
      </div>
      <div class="modal-body">
        <p id="statusModalMessage">
          
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancelar
        </button>
        <button type="button" class="btn btn-success" id="confirmChange">
          Confirmar
        </button>
      </div>
    </div>
  </div>
</div>

<div
  class="modal fade"
  id="finishModal"
  tabindex="-1"
  aria-labelledby="finishModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-warning text-white">
        <h5 class="modal-title" id="finishModalLabel">Cerrar Ticket</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Cerrar"
        ></button>
      </div>
      <div class="modal-body">
        <p id="finishModalMessage">
          
        </p>
        <div class="mb-3">
          <label for="finishReason" class="form-label"
            >Detalle de Solución:</label
          >
          <textarea
            id="finishReason"
            class="form-control"
            rows="3"
            placeholder="Escribe la solución del caso..."
          ></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancelar
        </button>
        <button type="button" class="btn btn-success" id="confirmFinish">
          Confirmar
        </button>
      </div>
    </div>
  </div>
</div>
