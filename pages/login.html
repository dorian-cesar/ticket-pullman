
<div class="container-md d-flex flex-column justify-content-center align-items-center flex-grow-1 text-center"
  id="login-view">
  <div class="loginForm-container mx-auto text-center">
    <div class="contenedor-img">
      <img src="./assets/img/Logo.svg" alt="" />
    </div>
    <h1 class="my-4 fs-1">Iniciar Sesión</h1>
    <form id="loginForm" class="mx-auto mb-4 col-12 col-md-8">
      <div class="mb-3 text-left">
        <label for="email" class="form-label mt-2">Correo Electrónico</label>
        <input type="email" class="form-control" placeholder="Ej: micorreo@email.com" id="email" required />
      </div>
      <div class="mb-3 text-left">
        <label for="password" class="form-label mt-2">Contraseña</label>
        <input type="password" class="form-control" placeholder="Ej: password123" id="password" required />
      </div>
      <button type="submit" class="btn btn-black mt-4 col-12">
        Ingresar
      </button>
    </form>
  </div>
</div>
